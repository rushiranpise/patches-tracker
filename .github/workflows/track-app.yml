name: Track single app

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App ID from config.toml (e.g. inure-app-manager-github)"
        required: true
        type: string

concurrency:
  group: track-app-${{ inputs.app }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        options: >-
          --health-cmd "curl -f http://localhost:8191/ || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    steps:
      - name: Checkout tracker
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install resolver tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq wget curl unzip zip aapt apktool
          sudo apt-get install -y apksigner || true
          curl -L --fail -o htmlq.tar.gz \
            https://github.com/mgdm/htmlq/releases/latest/download/htmlq-x86_64-linux.tar.gz
          sudo tar xf htmlq.tar.gz -C /usr/local/bin
          sudo chmod +x /usr/local/bin/htmlq

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check target repo access
        env:
          GH_TOKEN: ${{ secrets.PATCHES_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_PATCHES_REPO_TOKEN: ${{ secrets.PATCHES_REPO_TOKEN != '' }}
        run: |
          echo "PATCHES_REPO_TOKEN configured: ${HAS_PATCHES_REPO_TOKEN}"
          gh api repos/rushiranpise/morphe-patches --jq '.full_name' || true
          gh api user --jq '"Authenticated as: " + .login' || true
          gh auth setup-git || true

      - name: List available app IDs
        run: |
          echo "=== Available apps ==="
          grep -E '^\[' config.toml | tr -d '[]' | sort

      - name: Run tracker for ${{ inputs.app }}
        env:
          GH_TOKEN: ${{ secrets.PATCHES_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PATCHES_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          TRACKER_REPO_TOKEN: ${{ github.token }}
          FLARESOLVERR_URL: http://localhost:8191
          GPLAY_DISPENSER_URL: ${{ secrets.GPLAY_DISPENSER_URL || '' }}
          FETCH_RETRIES: "3"
          APKCOMBO_RETRIES: "3"
          RESOLVER_TIMEOUT_SECONDS: "300"
          APK_MERGE_TIMEOUT_SECONDS: "240"
        run: >-
          python -m tracker.cli
          --config config.toml
          --app ${{ inputs.app }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracker-logs-${{ inputs.app }}
          path: |
            logs
            status.json
            STATUS.md

      - name: Upload APK artifacts
        if: hashFiles('artifacts/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: patched-apks-${{ inputs.app }}
          path: artifacts
